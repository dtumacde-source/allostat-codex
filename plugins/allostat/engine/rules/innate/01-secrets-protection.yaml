id: innate-01
name: Never overwrite secrets / API keys / credentials files
severity: lethal
tier: innate
description: >
  Files matching well-known secrets patterns (.env*, secrets/, credentials*,
  *_key.txt, *_token.txt, etc.) must never be written, overwritten, or edited
  in place — these files often have specific structure that's easy to
  corrupt. Both operations are gated (W2-D audit H-08: the trigger was
  write-only, so edit-in-place bypassed the rule its own text claimed to
  enforce). Reads are NOT gated — read-only access is the rule's own
  suggested remedy. The default response is a hard pause; this partial build
  cannot authenticate model-inaccessible local authorization and directs the
  operator to a trusted external editing workflow.
trigger:
  # `target_must_exist` (2026-07-30): this rule guards OVERWRITES. A path that
  # does not exist yet has nothing to lose, and refusing its creation is how the
  # guard trained operators to suspend the entire rule set. Existence
  # is evaluated FAIL-SAFE: only a definitive "not found" relaxes the rule.
  match_any:
    - operation: [write, edit]
      file_pattern: "**/.env*"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/secrets/**"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/credentials*"
      target_must_exist: true
    # PRE-EXISTING GAP, found 2026-07-25 while narrowing the two globs below:
    # "**/credentials*" is prefix-anchored, so `aws_credentials` and this
    # repo's own `/etc/allostat-server/backup-credentials` never matched. Same
    # extension-anchored shape as *_key / *_token, so it covers the real files
    # without matching source like `test_credentials_flow.py`.
    - operation: [write, edit]
      file_pattern: "**/*credentials"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*credentials.json"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*credentials.txt"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*_key.txt"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*_key.json"
      target_must_exist: true
    # Credential FILES, matched the same way *_key is above (2026-07-25).
    # These were "**/*_token*" and "**/*api_key*", which match on any filename
    # CONTAINING the word — so ordinary source matched: the rule fired on
    # server/tests/test_webhook_mints_verify_token.py and demanded a
    # credentials-override phrase to edit a test. A guard that cries wolf on
    # source files trains its operator to type the override reflexively, which
    # is worse than the pattern being slightly narrower. The description above
    # already states the intent as "*_key.txt, *_token.txt, etc.".
    # The NAME part stays broad; the EXTENSION is what discriminates. Anchoring
    # only the name (e.g. "**/*api_key.txt") would drop `api_keys.txt`, which
    # the old glob caught -- the regression this shape avoids.
    - operation: [write, edit]
      file_pattern: "**/*_token*.txt"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*_token*.json"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*_token"
      target_must_exist: true
    - operation: [write, edit]
      file_pattern: "**/*api_key*.txt"
      target_must_exist: true
      case_sensitive: false
    - operation: [write, edit]
      file_pattern: "**/*api_key*.json"
      target_must_exist: true
      case_sensitive: false
    - operation: [write, edit]
      file_pattern: "**/*api_key"
      target_must_exist: true
      case_sensitive: false
    - operation: [write, edit]
      file_pattern: "**/*api_keys"
      target_must_exist: true
      case_sensitive: false
response:
  action: hard_pause
  display: red_box
  message: |
    ⛔ SECRETS FILE PROTECTION TRIPPED

    Attempted write/overwrite to: {file_path}

    This file matches the secrets-protection pattern. Overwriting it could
    destroy operator credentials. Edit-in-place is also risky.

    How to proceed:

      • Use read-only access, which this rule does not block.
      • Write the proposed value to a new non-credential file for review.
      • If an exact protected-file write is necessary, stop and use a trusted
        external editing workflow. This partial build cannot authenticate a
        local confirmation against same-user executors.
exception_required: trusted_protected_write_capability_unavailable
why_lethal: >
  Lost API keys mean lost service access, broken production deployments,
  potential billing surprises if keys end up in version control. Recovery
  requires regenerating keys at every provider — measured in hours of work.
