# ============================================================
# GENERAL — always-eligible — Concepts
# ============================================================

- id: concept-allostatic-load-001
  class: always-eligible
  weight: 4
  cooldown_days: 14
  context_conditions: null
  variants:
  - 'Allostatic load measures chronic regulatory stress on a project. Only deadline-bearing or compounding-cost items contribute; 200 inert todos count as zero.'
  - 'The load meter reflects active stress, not total work. Project-isolated; commit-bearing items raise it; reading code doesn''t.'
  - 'Allostatic load is item-filtered, not work-volume. Most todos are inert until acted on.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-adaptivity-001
  class: always-eligible
  weight: 4
  cooldown_days: 14
  context_conditions: null
  variants:
  - 'Adaptivity measures how well-fitted Allostat is to you. Combines rule depth, refinement events, voice fidelity, pattern detection, override rate.'
  - 'The adaptivity meter tracks Allostat-to-operator fit, not productivity. Rich rules + low override rate reads HIGH.'
  - 'Adaptivity is the system''s tuning index. Even cold-open sessions show non-zero adaptivity from imprinted user-tier rules.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-rule-tiers-001
  class: always-eligible
  weight: 4
  cooldown_days: 14
  context_conditions: null
  variants:
  - 'Rules layer in five tiers: innate (10 ship-with), user (cross-project), umbrella (linked-project), project (single), session (transient).'
  - 'Rule precedence: lower tiers override higher only via explicit logged exceptions. Innate ships with the plugin; learned rules accumulate.'
  - 'The five tiers form the inheritance hierarchy. User-tier voice samples and preferences carry across all projects.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-archipelago-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - 'Each Allostat project is its own organism. Load is project-isolated; user-tier rules apply across all islands.'
  - 'Allostat''s archipelago topology: linked projects share imprinted preferences, evolve learned rules independently, never aggregate load.'
  - 'Projects are separate organisms in one archipelago. Cross-project file access fires welcome banners but doesn''t merge load math.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-voice-keeper-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - 'Voice-keeper protects your prose voice. When Allostat produces text, it evaluates output against your reference and flags drift.'
  - 'Allostat''s voice-keeper applies your samples to any text deliverable. Iterates writer-to-keeper until output matches.'
  - 'When Allostat writes copy, voice-keeper checks it against your reference file. Catches drift before it ships.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-pattern-observer-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - 'Pattern Observer captures behavior across sessions. Four sustained occurrences without contradiction triggers a learned-rule proposal.'
  - 'Allostat''s learning loop fires at N=4 cross-session (N=2 in-session). Pattern Observer surfaces a proposal; you approve, the rule enters with amplified retrieval.'
  - 'Pattern Observer is the positive feedback loop. Detects repeated behavior, proposes formalization, normalizes after approval.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-handoff-001
  class: always-eligible
  weight: 4
  cooldown_days: 10
  context_conditions: null
  variants:
  - 'Handoff cadence: write one at session-end on every load-bearing session. Skipping == lossy continuity.'
  - 'Session-end handoffs capture state — decisions, open threads, next steps. /loadhandoff reads them back on the next session.'
  - 'Handoffs are the bridge between sessions. Allostat auto-generates one at 50k/150k/300k/500k volume thresholds.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: concept-stress-response-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - 'Stress-response watches for repeated tool failures, contradictions, drift, and chronic patterns. Fires nudges when thresholds cross.'
  - 'Allostat''s stress-response cascade is staged: fast for acute (red-box), slow for chronic (gradual surface).'
  - 'When something feels off mid-session, /allostat why-fired reveals which stress-response triggered.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

