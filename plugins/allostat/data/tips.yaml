version: 2
schema: curated-2026-05-15
last_updated: '2026-05-15'
curated_by: advisor
supersedes: legacy v1 tips file (270 tips, ~235 of which were auto-generated filler with operator-specific pollution)
curation_notes:
- Cut all single-variant auto-generated filler from the v2 merge.
- Cut all operator-specific references (operator prose, brand palette, drive letters, project names, vertical-specific content, marketing channels).
- Each tip carries 3 materially-different variants (not three rephrasings of the same idea).
- Persona tagging used only for skill-activation triggers; session-start tips default to `general` until v2.5 persona-routing logic ships in the wrapper.
- Voice is terse imperative — no hedge words ("consider", "you might want to", "perhaps"), no AI-slop ("leverage", "robust", "comprehensive", "seamless").
schema_fields_locked_2026_05_08:
- persona (general + 10 task_class personas)
- category (discovery | lifecycle | workflow | skill-support)
- axis (task_class | user_identity)
- fires_when (session_start | skill_activation:<skill-name> | both)
- skill_target (when category == skill-support)
- conflicts_with (list of nudge ids; default [])
schema_fields_preserved_from_v1:
- id, class, weight (1-5), cooldown_days, context_conditions, variants
total_tips: 78
