# ============================================================
# GENERAL — always-eligible — Memory hygiene
# ============================================================

- id: sort-memory-001
  class: always-eligible
  weight: 5
  cooldown_days: 7
  context_conditions: null
  variants:
  - 'Type #sort-memory to audit your memory tree. Allostat scans for overlap, proposes merges, slims MEMORY.md to navigation only.'
  - 'Memory tree drifting? #sort-memory consolidates overlapping rules and updates cross-references in one pass.'
  - '#sort-memory is the hygiene shortcut. Catches feedback-file accumulation before it bloats your context budget.'
  persona: general
  category: lifecycle
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: merge-memory-001
  class: always-eligible
  weight: 4
  cooldown_days: 7
  context_conditions: null
  variants:
  - '#merge-memory scans feedback files for conceptual overlap above 50%. Approve in batch; consolidate without manual review.'
  - 'MEMORY.md past 100 lines? Run #merge-memory. Proposes merges with diffs so you can collapse redundancy cleanly.'
  - 'Use #merge-memory to find rule duplication. You approve, Allostat consolidates. Inverse of just-deleting.'
  persona: general
  category: lifecycle
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: audit-memory-001
  class: always-eligible
  weight: 3
  cooldown_days: 14
  context_conditions: null
  variants:
  - '#audit-memory runs sort + merge + a 90-day staleness check in one pass. Monthly hygiene.'
  - 'Want a full sweep? #audit-memory flags rules unreferenced for 90+ days alongside standard sort and merge.'
  - 'Comprehensive audit in one command. #audit-memory pulls sort, merge, and staleness into a single pass.'
  persona: general
  category: lifecycle
  axis: task_class
  fires_when: session_start
  conflicts_with: []

