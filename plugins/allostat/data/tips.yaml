- id: workflow-sandbox-001
  class: always-eligible
  weight: 3
  cooldown_days: 14
  context_conditions: null
  variants:
  - 'Sandbox folder convention: <project>_sandbox/ for draft variants and exploration. Keep working drafts out of canon.'
  - 'Use a sandbox subfolder for variants you don''t want in canon yet. README.md frames permissions and scope.'
  - 'Sandbox folders quarantine experimental work. Canon files stay clean; explorations land alongside dated.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: workflow-legacy-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - '_LEGACY suffix on every rollout — archive the superseded version IN THE SAME TURN, not "later".'
  - 'When you replace a file, rename the old to *_LEGACY_pre_<event>_<date>.<ext>. Same turn, no deferral.'
  - 'LEGACY archival is mid-rollout discipline. The 30-day clock starts when the suffix lands.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: workflow-purge-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - 'PURGE lifecycle: LEGACY files → _PURGE/YYYYMMDD/ at 30 days → safe wholesale-delete at 60 days.'
  - 'Two-stage archive. _LEGACY for 30 days, _PURGE for 30 more, then disposal. Reversible the whole way.'
  - 'The purge sweep is monthly. /allostat tend triggers a per-project pass; ''run the purge sweep'' triggers the global.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: workflow-three-pass-001
  class: always-eligible
  weight: 3
  cooldown_days: 21
  context_conditions: null
  variants:
  - 'Three-pass design workflow: Brainstorm → Plan → Execute. Skipping passes 1-2 leads to 15+ revision cycles.'
  - 'Brainstorm before planning. Plan before executing. The two front passes are short; skipping them stretches the third.'
  - 'For non-trivial work, separate the three passes explicitly. Each pass has a different skill loaded.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: workflow-canonical-001
  class: always-eligible
  weight: 2
  cooldown_days: 30
  context_conditions: null
  variants:
  - 'CANONICAL.txt marker drops in the active edit folder when two folders look canonical. Easy disambiguation.'
  - 'Mark canon explicitly when you''ve got dev-tree, runtime-cache, and marketplace copies. CANONICAL.txt is the tiebreaker.'
  - 'Multi-copy divergence breaks edits silently. CANONICAL.txt + sync-to-runtime is the standard pattern.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

- id: workflow-memory-architecture-001
  class: always-eligible
  weight: 2
  cooldown_days: 30
  context_conditions: null
  variants:
  - 'Memory tree asymmetry: cwd determines which memory loads, not the project name. Follow MEMORY.md pointers.'
  - 'If the cwd doesn''t match the project you''re working in, the wrong memory loads. associated_directories.md is the canonical map.'
  - 'Memory loads from ~/.claude/projects/<sanitized-cwd>/memory/. Routing across projects is your job, not the harness''s.'
  persona: general
  category: workflow
  axis: task_class
  fires_when: session_start
  conflicts_with: []

